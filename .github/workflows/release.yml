name: Build release distributions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version for manual package verification
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-five-runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, re
          value = os.environ["RELEASE_TAG"] if os.environ["EVENT_NAME"] == "release" else os.environ["MANUAL_VERSION"]
          normalized = value.removeprefix("v")
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9.-]+)?", normalized), "Invalid release version"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("value=" + normalized + "\n")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Download pinned Builder archive
        env:
          SOURCE_URL: https://github.com/erland/gpt-byggaren/releases/download/v1.6.26/gpt-byggaren-chat-1.6.26.zip
          EXPECTED_SHA256: 92b8cd1cc82a06f0bff51a016be5bdb29a588ba46b059096d4208cd7ba6f7ce8
        run: |
          python - <<'PY'
          import os,re
          from urllib.parse import urlparse
          from urllib.request import urlopen
          from pathlib import Path
          url=os.environ["SOURCE_URL"]
          digest=os.environ["EXPECTED_SHA256"].lower()
          p=urlparse(url)
          assert p.scheme=="https" and p.hostname in {"github.com","objects.githubusercontent.com","release-assets.githubusercontent.com"}, "Only GitHub-hosted HTTPS releases supported"
          assert re.fullmatch(r"[a-f0-9]{64}",digest), "Invalid SHA-256"
          with urlopen(url,timeout=60) as response:
              data=response.read(32*1024*1024+1)
          assert len(data)<=32*1024*1024,"Archive too large"
          import hashlib
          actual=hashlib.sha256(data).hexdigest()
          assert actual==digest, f"Engine archive SHA-256 mismatch: {actual}"
          Path("builder.zip").write_bytes(data)
          PY
      - name: Unpack Builder safely
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          dest=Path("builder")
          dest.mkdir()
          with zipfile.ZipFile("builder.zip") as z:
              for f in z.infolist():
                  name=Path(f.filename)
                  assert not name.is_absolute() and ".." not in name.parts,"Unsafe ZIP path"
                  assert f.file_size<32*1024*1024,"Oversize member"
              z.extractall(dest)
          assert (dest/"distribution-engine/gpt-project.yaml").is_file(),"Wrong Builder archive"
          PY
      - name: Prepare isolated canonical project
        run: python scripts/prepare_builder_1626.py --engine builder/distribution-engine --output ../migration-project
      - name: Install matching canonical engine
        run: python builder/distribution-engine/scripts/install_distribution_engine.py --source builder/distribution-engine --project-root ../migration-project
      - name: Build five distribution archives
        run: python ../migration-project/scripts/build_distributions.py --project-root ../migration-project --version ${{ steps.version.outputs.value }}
      - name: Regression test Skill frontmatter stamping
        run: python scripts/test_stamp_skill_versions.py
      - name: Stamp versions into generated Skills
        run: python scripts/stamp_skill_versions.py --dist ../migration-project/dist --version ${{ steps.version.outputs.value }}
      - name: Validate distribution archives
        run: |
          cd ../migration-project
          python scripts/validate_distributions.py --project-root .
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archives=sorted(Path("dist").glob("*.zip"))
          assert len(archives)==6, [a.name for a in archives]
          for p in archives:
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None,p
          project=[p for p in archives if p.name.startswith("kodforbattraren-project-")]
          assert len(project)==1, [p.name for p in project]
          with zipfile.ZipFile(project[0]) as z:
              leaked=[n for n in z.namelist() if n == "builder.zip" or n.startswith(("builder/","migration-artifacts/"))]
              assert not leaked, "Build-environment files leaked: "+str(leaked[:10])
          plugin=[p for p in archives if "-plugin-" in p.name]
          assert len(plugin)==1, [p.name for p in plugin]
          with zipfile.ZipFile(plugin[0]) as z:
              names=z.namelist()
              assert "plugin.json" in names, "Plugin manifest missing"
              assert len([n for n in names if n.endswith("/SKILL.md")]) >= 3, "Plugin skills missing"
              runtime_scripts=[n for n in names if n.endswith(".py")]
              print("Plugin Python scripts:",len(runtime_scripts),"(host execution unverified)")
          print("PASS",len(archives),"ZIP archives; no Builder leakage")
          PY
      - name: Stage artifacts inside checkout
        run: |
          mkdir -p migration-artifacts
          cp ../migration-project/dist/* migration-artifacts/
      - name: Build and selftest optional Engine ZIP
        run: |
          python scripts/build_optional_engine.py --version ${{ steps.version.outputs.value }} --output migration-artifacts/kodforbattraren-engine-${{ steps.version.outputs.value }}.zip
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import zipfile
          import tempfile
          archive=Path("migration-artifacts/kodforbattraren-engine-${{ steps.version.outputs.value }}.zip")
          with tempfile.TemporaryDirectory() as tmp:
              with zipfile.ZipFile(archive) as z:
                  assert z.testzip() is None
                  z.extractall(tmp)
              subprocess.run(["python",str(Path(tmp)/"scripts/selftest.py")],check=True)
          PY
      - name: Include Engine ZIP in release manifest and checksums
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          folder = Path("migration-artifacts")
          engines = list(folder.glob("kodforbattraren-engine-*.zip"))
          assert len(engines) == 1, engines
          engine = engines[0]
          checksum = hashlib.sha256(engine.read_bytes()).hexdigest()
          sums = folder / "SHA256SUMS.txt"
          existing = sums.read_text(encoding="utf-8")
          assert engine.name not in existing
          sums.write_text(existing.rstrip() + "\n" + checksum + "  " + engine.name + "\n", encoding="utf-8")
          manifest_path = folder / "DELIVERY-MANIFEST.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert not any(a.get("file") == engine.name for a in manifest["artifacts"])
          manifest["artifacts"].append({"type": "engine_zip", "file": engine.name, "sha256": checksum, "size": engine.stat().st_size, "artifact_id": "optional_engine"})
          checksums = next(a for a in manifest["artifacts"] if a.get("file") == "SHA256SUMS.txt")
          checksums["sha256"] = hashlib.sha256(sums.read_bytes()).hexdigest()
          checksums["size"] = sums.stat().st_size
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          assert checksum in sums.read_text(encoding="utf-8")
          print("PASS: Engine ZIP included in delivery manifest and checksums")
          PY
      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kodforbattraren-${{ steps.version.outputs.value }}
          path: migration-artifacts/
          if-no-files-found: error

      - name: Validate workflow parity
        run: python scripts/validate_workflow_parity.py

      - name: Attach packages to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" migration-artifacts/* --clobber
