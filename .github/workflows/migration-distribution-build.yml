name: Migration distribution build (GPT Byggaren 1.6.26)

on:
  workflow_dispatch:
    inputs:
      engine_archive_url:
        description: "HTTPS URL to verified GPT Byggaren Chat ZIP 1.6.26"
        type: string
        required: true
      engine_sha256:
        description: "Expected SHA-256 of the exact GPT Byggaren ZIP"
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify-five-runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Download pinned Builder archive
        env:
          SOURCE_URL: ${{ inputs.engine_archive_url }}
          EXPECTED_SHA256: ${{ inputs.engine_sha256 }}
        run: |
          python - <<'PY'
          import os,re
          from urllib.parse import urlparse
          from urllib.request import urlopen
          from pathlib import Path
          url=os.environ["SOURCE_URL"]
          digest=os.environ["EXPECTED_SHA256"].lower()
          p=urlparse(url)
          assert p.scheme=="https" and p.hostname in {"github.com","objects.githubusercontent.com","release-assets.githubusercontent.com"}, "Only GitHub-hosted HTTPS releases supported"
          assert re.fullmatch(r"[a-f0-9]{64}",digest), "Invalid SHA-256"
          with urlopen(url,timeout=60) as response:
              data=response.read(32*1024*1024+1)
          assert len(data)<=32*1024*1024,"Archive too large"
          import hashlib
          actual=hashlib.sha256(data).hexdigest()
          assert actual==digest, f"Engine archive SHA-256 mismatch: {actual}"
          Path("builder.zip").write_bytes(data)
          PY
      - name: Unpack Builder safely
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          dest=Path("builder")
          dest.mkdir()
          with zipfile.ZipFile("builder.zip") as z:
              for f in z.infolist():
                  name=Path(f.filename)
                  assert not name.is_absolute() and ".." not in name.parts,"Unsafe ZIP path"
                  assert f.file_size<32*1024*1024,"Oversize member"
              z.extractall(dest)
          assert (dest/"distribution-engine/gpt-project.yaml").is_file(),"Wrong Builder archive"
          PY
      - name: Prepare isolated canonical project
        run: python scripts/prepare_builder_1626.py --engine builder/distribution-engine --output ../migration-project
      - name: Install matching canonical engine
        run: python builder/distribution-engine/scripts/install_distribution_engine.py --source builder/distribution-engine --project-root ../migration-project
      - name: Build five distribution archives
        run: python ../migration-project/scripts/build_distributions.py --version migration-ci
      - name: Validate distribution archives
        run: |
          cd ../migration-project
          python scripts/validate_distributions.py --project-root .
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archives=sorted(Path("dist").glob("*.zip"))
          assert len(archives)==6, [a.name for a in archives]
          for p in archives:
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None,p
          print("PASS",len(archives),"ZIP archives")
          PY
      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: migration-five-runtimes
          path: ../migration-project/dist/
          if-no-files-found: error
