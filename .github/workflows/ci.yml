name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --upgrade -r requirements-ci.txt

      - name: Validate project status
        run: python scripts/validate_project_status.py

      - name: Validate runtime models
        run: python scripts/validate_runtime_models.py

      - name: Check project hygiene
        run: python scripts/check_project_hygiene.py

      - name: Run runtime tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider tests/runtime

      - name: Build distribution smoke test
        run: python scripts/build_distributions.py --version ci-${{ github.sha }}

      - name: Verify generated archives
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          manifest = json.loads(Path("dist/release-manifest.json").read_text())
          assert len(manifest["artifacts"]) == 2
          for name in manifest["artifacts"]:
              path = Path("dist") / name
              assert path.exists(), name
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None, name
          print("PASS generated archives")
          PY
